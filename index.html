<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6750a4">
<title>PyPad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<link rel="stylesheet" href="index.css">
</head>
<body>
<header class="bar">
  <h1>PyPad</h1>
  <span id="status" class="chip">Loading Python…</span>
  <button id="clear" class="icon" aria-label="Clear output"><span class="ms">delete_sweep</span></button>
</header>

<main>
  <section id="editorPane" class="pane on"><textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor"></textarea></section>
  <section id="outPane" class="pane"><div id="out"><p class="empty">Run your code to see output here.</p></div></section>
</main>

<button id="run" class="fab"><span class="ms">play_arrow</span>Run</button>
<button id="stop" class="fab stop" hidden><span class="ms">stop</span>Stop</button>

<nav class="nav">
  <button data-tab="editorPane" class="on"><span class="ms">code</span>Code</button>
  <button data-tab="outPane"><span class="ms">terminal</span>Output</button>
</nav>

<dialog id="dlg">
  <form method="dialog">
    <p id="dlgPrompt"></p>
    <input id="dlgInput" autocomplete="off" aria-label="Input">
    <div class="actions"><button class="text">OK</button></div>
  </form>
</dialog>

<script type="module" src="index.js"></script>
</body>
</html>
